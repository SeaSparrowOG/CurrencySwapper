name: currencyswapper
alias: crs
script: SEA_BarterFunctions
help: Currency Swapper
subs:
  - name: reloadinisettings
    alias: ris
    func: ReloadINISettings
    help: Reloads all ini settings in memory.
  - name: issuppressinggoldnotifications
    alias: sgn
    func: IsSuppressingGoldNotifications
    help: Returns true if gold notifications are currently being suppressed.
  - name: revertcurrency
    alias: rc
    func: ResetCurrency
    help: Resets the currency accepted by merchants.
  - name: setcurrency
    alias: sc
    func: SetCurrencyConsole
    help: Changes the currency accepted by merchants to the specified EditorID. Requires PO3's tweaks.
    args:
      - name: setting
        type: string
        required: true
        help: The EditorID of the currency to swap to.
  - name: setsuppress
    alias: ss
    func: SuppressGoldNotifications
    help: Toggles the suppress feature on or off.
    args:
      - name: setting
        type: bool
        required: true
        help: True or False.
  - name: settrainingoverrides
    alias: sto
    func: SetTrainingOverridesConsole
    help: Sets training overrides.
    args:
      - name: allowmultiplier
        type: string
        required: true
        help: Read the docs.
      - name: multiplier
        type: string
        required: true
        help: Read the docs.
      - name: allowbase
        type: string
        required: true
        help: Read the docs.
      - name: base
        type: string
        required: true
        help: Read the docs.